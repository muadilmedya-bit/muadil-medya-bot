name: Weekly topic research
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Find candidate topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/topics.py config/profile_en.yaml
      - name: Commit candidates
        run: |
          git config user.name "research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/candidates.json
          git diff --staged --quiet || git commit -m "Weekly candidates"
          git push
