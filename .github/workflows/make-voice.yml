name: Make voice
on:
  workflow_dispatch:
    inputs:
      sections:
        description: "How many sections to voice (2 = quick test, 0 = all sections)"
        required: false
        default: "2"
      voice:
        description: "Voice name, for example en-US-AndrewNeural (empty = use config)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - run: pip install -r requirements.txt edge-tts
      - name: Make voice
        env:
          LIMIT: ${{ github.event.inputs.sections }}
          VOICE: ${{ github.event.inputs.voice }}
        run: python -u src/voice.py config/profile_en.yaml
      - name: Save audio and timings as downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: voice
          path: |
            out/voice/narration.mp3
            out/voice/timings.json
            out/voice/subtitles.srt
      - name: Commit timing files (full runs only)
        if: ${{ github.event.inputs.sections == '0' }}
        run: |
          git config user.name "research-bot"
          git config user.email "bot@users.noreply.github.com"
          cp out/voice/timings.json data/timings.json
          cp out/voice/subtitles.srt data/subtitles.srt
          git add data/timings.json data/subtitles.srt
          git diff --staged --quiet || git commit -m "Voice timings"
          git push
