name: Make script
on:
  workflow_dispatch:
    inputs:
      candidate_number:
        description: "Which candidate topic (1-5)"
        required: true
        default: "4"
permissions:
  contents: write
jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Write script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE: ${{ github.event.inputs.candidate_number }}
        run: python src/script.py "$CANDIDATE" config/profile_en.yaml
      - name: Commit script
        run: |
          git config user.name "research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/script.json data/script.md
          git diff --staged --quiet || git commit -m "New script"
          git push
